<!DOCTYPE html>
<html>
<head>
    <title>Senthil Store Billing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
</head>
<body>
<a href="products.html">
    <button>📦 View Products</button>
</a>
<div class="container">

    <!-- SHOP HEADER -->
    <div class="header">
        <h1>SENTHIL STORE</h1>
        <p class="address">264E, Thiruvalluvar Salai, Pothanur</p>
    </div>

    <!-- ADD PRODUCT -->
    <h3>➕ Add Product</h3>
    <input id="pname" placeholder="Product">
    <input id="pprice" type="number" placeholder="Price">
    <button onclick="addProduct()">Add</button>

    <!-- BILLING -->
    <h3>🧾 Billing</h3>
    <input id="search" placeholder="Product name">
    <input id="qty" type="number" placeholder="Qty">
    <button onclick="addToCart()">Add</button>

    <table id="bill">
        <tr>
            <th>Item</th><th>Qty</th><th>Price</th><th>Total</th>
        </tr>
    </table>

    <h2 class="total">Total: ₹ <span id="total">0</span></h2>

    <button class="bill-btn" onclick="generateBill()">Generate Bill</button>

    <!-- QR -->
    <div id="qr" style="display:none;">
        <h3>📱 Scan & Pay</h3>
        <img src="qr.png" width="200">
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
